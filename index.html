<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>My Portfolio</title>
    <style>
        body {
            background: linear-gradient(to right, #74ebd5, #9face6);
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        .card {
            background: white;
            width: 350px;
            margin: 80px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 22px;
            color: #333;
        }

        p {
            color: #555;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://via.placeholder.com/150" alt="Profile">
        <h1>สวัสดีครับ ยินดีต้อนรับสู่พอร์ตของตามพร</h1>
        <p>ชื่อ-นามสกุล : นางสาวตามพร ลุงทุน</p>
        <p>ตำแหน่ง : นักศึกษาสาขาเทคโนโลยีสารสนเทศ</p>
    </div>

</body>
</html>
